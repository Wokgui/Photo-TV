<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photo TV</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:Arial,sans-serif}
body{display:grid;place-items:center}
#wrap{position:relative;width:100vw;height:100vh;display:grid;place-items:center;background:#000}
#tv{display:block;max-width:100vw;max-height:100vh;width:auto;height:auto;aspect-ratio:16/9;background:#071019;box-shadow:0 0 0 1px #111}
input{display:none}
</style>
</head>
<body>
<div id="wrap">
<canvas id="tv" width="1280" height="720"></canvas>
<input id="folderInput" type="file" webkitdirectory multiple>
<input id="photoInput" type="file" accept="image/*" multiple>
</div>
<script>
const cv=document.getElementById('tv'),ctx=cv.getContext('2d');
let page=0,slideshow=false,focusNav=false,albumSel=0,editorElement=0,settingsCat=0;
const albums=[
["Norvège 2026",142,"https://commons.wikimedia.org/wiki/Special:Redirect/file/Oslo%20-%20Op%C3%A9ra%20-%20Ext%C3%A9rieur%2001.JPG?width=500"],
["Copenhague",318,"https://images.unsplash.com/photo-1513622470522-26c3c8a854bc?auto=format&fit=crop&w=500&q=80"],
["Châteaux",87,"https://images.unsplash.com/photo-1533154683836-84ea7a0bc310?auto=format&fit=crop&w=500&q=80"],
["Montagne",203,"https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=500&q=80"],
["Animaux",96,"https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=500&q=80"],
["Vacances",154,"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=500&q=80"]
];
const photoUrls=[
albums[0][2],
"https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=500&q=80",
"https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=500&q=80",
"https://images.unsplash.com/photo-1464278533981-50106e6176b1?auto=format&fit=crop&w=500&q=80",
"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=500&q=80",
"https://images.unsplash.com/photo-1513622470522-26c3c8a854bc?auto=format&fit=crop&w=500&q=80"
];
const imgs={};
[...albums.map(a=>a[2]),...photoUrls].forEach(u=>{if(!imgs[u]){const i=new Image();i.crossOrigin="anonymous";i.onload=draw;i.src=u;imgs[u]=i}});
const demo=albums[0][2];
function rr(x,y,w,h,r,fill,stroke=null,lw=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function tx(t,x,y,s,c="#fff",bold=false,align="left"){ctx.font=`${bold?700:400} ${s}px Arial`;ctx.fillStyle=c;ctx.textAlign=align;ctx.textBaseline="alphabetic";ctx.fillText(t,x,y)}
function imgCover(url,x,y,w,h,r=0){const im=imgs[url];if(!im||!im.complete)return;ctx.save();if(r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.clip()}const sc=Math.max(w/im.naturalWidth,h/im.naturalHeight),sw=im.naturalWidth*sc,sh=im.naturalHeight*sc;ctx.drawImage(im,x+(w-sw)/2,y+(h-sh)/2,sw,sh);ctx.restore()}
function gradient(x,y,w,h,c1,c2,vert=false,r=0){const g=ctx.createLinearGradient(x,y,vert?x:x+w,vert?y+h:y);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;if(r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}else ctx.fillRect(x,y,w,h)}
function camera(x,y){rr(x-14,y-10,32,23,5,"#d3dcef");rr(x-7,y-15,15,7,4,"#aec2e5");ctx.fillStyle="#2d5ba0";ctx.beginPath();ctx.arc(x+2,y+1,7,0,Math.PI*2);ctx.fill();ctx.fillStyle="#71a1e4";ctx.beginPath();ctx.arc(x+2,y+1,4,0,Math.PI*2);ctx.fill()}
function brand(x,y,sub){camera(x+15,y+18);tx("Photo TV",x+48,y+23,25,"#fff",true);tx(sub,x+48,y+49,11,"#cedaed")}
function bottomNav(){const x=280,y=646,w=720,h=62;rr(x,y,w,h,18,"rgba(3,15,28,.93)","#16314d");const labs=["Aperçu","Photos","Éditeur","Réglages"];for(let i=0;i<4;i++){const xx=x+i*180;if(i===page){gradient(xx+3,y+4,174,h-8,"#0c80ff","#075bed",false,16)}tx(["▣","▣","◉","⚙"][i],xx+49,y+38,17,"#fff",false,"center");tx(labs[i],xx+72,y+38,13.5,"#fff")}}
function darkBg(){gradient(0,0,1280,720,"#07121e","#02080e");const g=ctx.createRadialGradient(1030,10,0,1030,10,520);g.addColorStop(0,"rgba(33,75,118,.38)");g.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=g;ctx.fillRect(0,0,1280,720)}
function clock(){const d=new Date(),date=d.toLocaleDateString("fr-FR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"}).replace(/^./,c=>c.toUpperCase()),time=d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});tx("☀  17 °C",1215,53,23,"#fff",false,"right");tx(date,1215,79,11,"#fff",false,"right");tx(time,1215,114,29,"#fff",true,"right")}
function preview(){imgCover(demo,0,0,1280,720);const g=ctx.createLinearGradient(0,330,0,720);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,.88)");ctx.fillStyle=g;ctx.fillRect(0,0,1280,720);brand(42,30,"DIAPORAMA");clock();rr(52,322,60,60,30,"rgba(7,15,24,.75)");tx("‹",82,364,40,"#fff",false,"center");rr(1168,322,60,60,30,"rgba(7,15,24,.75)");tx("›",1198,364,40,"#fff",false,"center");tx("001. Opéra d'Oslo",78,568,31,"#fff",true);tx("Norvège 2026",78,607,19);tx("3 / 142",1215,607,15,"#fff",false,"right");bottomNav()}
function sourceCard(x,y,w,title,sub,kind,primary=false){if(primary)gradient(x,y,w,102,"#0a89ff","#075aeb",false,14);else gradient(x,y,w,102,"#122131","#0a1724",false,14);ctx.strokeStyle=primary?"#59bcff":"#273a4f";ctx.lineWidth=primary?2:1;ctx.stroke(new Path2D(`M${x+14},${y}H${x+w-14}Q${x+w},${y} ${x+w},${y+14}V${y+88}Q${x+w},${y+102} ${x+w-14},${y+102}H${x+14}Q${x},${y+102} ${x},${y+88}V${y+14}Q${x},${y} ${x+14},${y}Z`));if(kind===1){rr(x+19,y+35,38,28,4,"#f6ba40");rr(x+23,y+30,16,8,3,"#ffcd51")}else if(kind===2){rr(x+18,y+33,40,34,5,"#dae4f2");tx("▰",x+38,y+57,19,"#3c5069",false,"center")}else tx("✦",x+39,y+65,42,"#fff",false,"center");tx(title,x+70,y+43,16,"#fff",true);tx(sub,x+70,y+68,12,"#dde7f4")}
function photos(){darkBg();brand(39,23,"PHOTOS ET ALBUMS");sourceCard(45,102,360,"Google Photos","Se connecter",0,true);sourceCard(420,102,360,"Choisir un dossier","Stockage local",1,false);sourceCard(795,102,440,"Sélectionner des photos","Choisir plusieurs fichiers",2,false);tx("Mes albums Google Photos",45,240,19,"#fff",true);tx("23 albums",1235,240,13,"#bac4d2",false,"right");const y=262,w=165,g=12;albums.forEach((a,i)=>{const x=45+i*(w+g);rr(x,y,w,150,12,"#08121b",i===albumSel?"#31b1ff":"#253547",i===albumSel?2:1);imgCover(a[2],x+5,y+5,w-10,92,9);tx(a[0],x+8,y+117,13,"#fff",true);tx(a[1]+" photos",x+8,y+138,11,"#bec8d6");if(i===albumSel){ctx.fillStyle="#0f7cff";ctx.beginPath();ctx.arc(x+w-16,y+87,12,0,Math.PI*2);ctx.fill();tx("✓",x+w-16,y+92,13,"#fff",true,"center")}});tx("Photos de l'album sélectionné",45,442,19,"#fff",true);photoUrls.forEach((u,i)=>imgCover(u,45+i*177,463,165,95,9));bottomNav()}
function metaCard(x,y,w,h,name,val,sel){if(sel)gradient(x,y,w,h,"#0a7dff","#0758eb",false,12);else gradient(x,y,w,h,"#0e1c29","#08141f",false,12);rr(x+14,y+19,28,28,7,"#0a7cff");tx("✓",x+28,y+39,15,"#fff",true,"center");tx(name,x+58,y+29,14,"#fff",true);tx(val,x+58,y+53,11,"#dde4ee")}
function editor(){darkBg();brand(34,20,"ÉDITEUR");const vals=["001. Opéra d'Oslo","Norvège 2026",new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"}),"15:42","17 °C"];for(let i=0;i<5;i++)metaCard(32,112+i*85,310,75,["Titre de la photo","Nom de l'album","Date","Heure","Température"][i],vals[i],i===editorElement);rr(366,64,566,574,5,"#0a1620");imgCover(demo,366,64,566,574);let g=ctx.createLinearGradient(0,310,0,638);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,.85)");ctx.fillStyle=g;ctx.fillRect(366,64,566,574);tx("☀  17 °C",900,98,18,"#fff",false,"right");tx("Samedi 27 septembre 2025",900,125,11,"#fff",false,"right");tx("15:42",900,158,26,"#fff",true,"right");tx("001. Opéra d'Oslo",400,540,31,"#fff",true);tx("Norvège 2026",400,576,19);ctx.strokeStyle="#1b82ff";ctx.lineWidth=2;ctx.strokeRect(392,505,285,88);[[392,505],[677,505],[392,593],[677,593]].forEach(([x,y])=>{ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#1b82ff";ctx.stroke()});rr(955,64,293,574,12,"#111d2b","#26374a");tx("Paramètres du titre",971,92,15,"#fff",true);tx("Texte",971,124,11,"#b4bfd0");rr(971,131,261,35,6,"#08141f","#32485e");tx("001. Opéra d'Oslo",981,154,11);tx("Police",971,189,11,"#b4bfd0");rr(1063,175,169,35,6,"#08141f","#32485e");tx("Inter",1073,198,11);sliderLine("Taille",79,971,240,261);tx("Couleur",971,304,12);rr(1065,288,38,32,5,"#fff","#7e8c9e");sliderLine("Position X",80,971,340,261);sliderLine("Position Y",85,971,401,261);tx("Alignement",971,484,12);rr(1063,462,126,36,7,"#1f2c3b");rr(1105,462,42,36,7,"#126cc3");tx("☰",1084,487,16,"#fff",false,"center");tx("☰",1126,487,16,"#fff",false,"center");tx("☰",1168,487,16,"#fff",false,"center");tx("Ombre",971,542,12);toggle(1160,528,true);bottomNav()}
function sliderLine(label,val,x,y,w){tx(label,x,y+13,12);tx(String(val),x+w-8,y+13,11,"#bfcad8",false,"right");const bx=x+95,by=y+7,bw=w-150;rr(bx,by,bw,6,3,"#293848");rr(bx,by,bw*(val/100),6,3,"#0d75f0");ctx.fillStyle="#0f82ff";ctx.beginPath();ctx.arc(bx+bw*(val/100),by+3,8,0,Math.PI*2);ctx.fill()}
function toggle(x,y,on){rr(x,y,52,28,14,on?"#0b7aff":"#2d3a49");ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(on?x+38:x+14,y+14,10,0,Math.PI*2);ctx.fill()}
function sideItem(y,name,active,icon){if(active)gradient(40,y,274,50,"#0c77ff","#0a5bed",false,11);tx(icon,66,y+31,20,"#fff",false,"center");tx(name,90,y+31,14)}
function settings(){darkBg();brand(34,20,"RÉGLAGES");rr(32,92,290,548,13,"#06121d","#162d45");const cats=["Diaporama","Éléments affichés","Style et position","Transitions","Heure et date","Température","Source des photos","Avancés"],icons=["▶","T","▣","▣","◷","♨","▣","⚙"];cats.forEach((n,i)=>sideItem(104+i*64,n,i===settingsCat,icons[i]));rr(345,92,903,548,13,"#111e2c","#26384c");tx("Diaporama",367,126,18,"#fff",true);settingsSlider("Durée d'affichage par photo",10,2,120,"10 secondes",367,154);settingsSegment("Mode d'affichage",["Automatique","Image fixe"],0,367,213);tx("Lecture en boucle",367,298,12);toggle(717,281,true);tx("Ordre des photos",367,356,12);rr(717,335,380,39,7,"#08141f","#32485e");tx("Dans l'ordre de l'album",730,361,12);tx("Transition entre les photos",367,413,13);const names=["Fondu","Glissement","Zoom","Ken Burns","Dissolution","Cube 3D"];names.forEach((n,i)=>{const xx=367+i*141;rr(xx,427,131,78,8,"#0d1b28",i===0?"#1d91ff":"#2f4256",i===0?2:1);imgCover(photoUrls[Math.min(i,photoUrls.length-1)],xx+3,430,125,49,6);tx(n,xx+65,496,10.5,"#fff",false,"center")});settingsSlider("Durée de la transition",2,.2,4,"2 secondes",367,520);tx("Effet panoramique (Ken Burns)",367,600,12);toggle(717,583,true);bottomNav()}
function settingsSlider(label,val,min,max,txtv,x,y){tx(label,x,y+25,12);const bx=x+350,by=y+18,bw=375,t=(val-min)/(max-min);rr(bx,by,bw,7,4,"#2b3a4a");rr(bx,by,bw*t,7,4,"#0a7bff");ctx.fillStyle="#0e87ff";ctx.beginPath();ctx.arc(bx+bw*t,by+3.5,9,0,Math.PI*2);ctx.fill();tx(txtv,x+862,y+25,12,"#fff",false,"right")}
function settingsSegment(label,vals,sel,x,y){tx(label,x,y+29,12);const bx=x+350,bw=380;rr(bx,y+6,bw,37,7,"#1f2c3b");const sw=bw/vals.length;vals.forEach((v,i)=>{if(i===sel)rr(bx+i*sw,y+6,sw,37,7,"#0d70e2");tx(v,bx+i*sw+sw/2,y+30,11,"#fff",false,"center")})}
function fullShow(){imgCover(demo,0,0,1280,720);const g=ctx.createLinearGradient(0,330,0,720);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,.88)");ctx.fillStyle=g;ctx.fillRect(0,0,1280,720);brand(42,30,"DIAPORAMA");clock();tx("001. Opéra d'Oslo",78,605,31,"#fff",true);tx("Norvège 2026",78,641,19)}
function draw(){ctx.clearRect(0,0,1280,720);if(slideshow)fullShow();else [preview,photos,editor,settings][page]()}
function mouse(e){const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*1280/r.width,y=(e.clientY-r.top)*720/r.height;if(slideshow){slideshow=false;draw();return}if(y>=640&&x>=280&&x<=1000){page=Math.max(0,Math.min(3,Math.floor((x-280)/180)));draw();return}if(page===0){if(x<160||x>1120)slideshow=true;draw();return}if(page===1&&y>=102&&y<=204){if(x<405||x<780)document.getElementById('folderInput').click();else document.getElementById('photoInput').click();return}if(page===1&&y>=262&&y<=412){albumSel=Math.max(0,Math.min(5,Math.floor((x-45)/177)));draw();return}if(page===2&&x>=32&&x<=342&&y>=112&&y<=537){editorElement=Math.max(0,Math.min(4,Math.floor((y-112)/85)));draw();return}if(page===3&&x>=32&&x<=322&&y>=104&&y<=616){settingsCat=Math.max(0,Math.min(7,Math.floor((y-104)/64)));draw();return}}
cv.addEventListener('click',mouse);
document.addEventListener('keydown',e=>{if(slideshow){if(e.key==="Escape"||e.key==="Backspace"){slideshow=false;draw()}return}if(e.key==="ArrowRight"){page=(page+1)%4;draw()}else if(e.key==="ArrowLeft"){page=(page+3)%4;draw()}else if(e.key==="Enter"&&page===0){slideshow=true;draw()}});
setInterval(draw,30000);draw();
</script>
</body>
</html>
