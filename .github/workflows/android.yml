name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: photo-tv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PHOTO_TV_RELEASE_KEYSTORE_B64: ${{ secrets.PHOTO_TV_RELEASE_KEYSTORE_B64 }}
      PHOTO_TV_RELEASE_STORE_PASSWORD: ${{ secrets.PHOTO_TV_RELEASE_STORE_PASSWORD }}
      PHOTO_TV_RELEASE_KEY_ALIAS: ${{ secrets.PHOTO_TV_RELEASE_KEY_ALIAS }}
      PHOTO_TV_RELEASE_KEY_PASSWORD: ${{ secrets.PHOTO_TV_RELEASE_KEY_PASSWORD }}
      PHOTO_TV_RELEASE_CERT_SHA256: ${{ secrets.PHOTO_TV_RELEASE_CERT_SHA256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate stable development signer
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --quiet cryptography
          python3 tools/generate_stable_signer.py build-keys/photo-tv-stable.p12
          keytool -list -v -storetype PKCS12             -keystore build-keys/photo-tv-stable.p12             -storepass phototv-stable             -alias phototv | grep -E "SHA256|Owner|Valid from" || true

      - name: Prepare secure release signer when configured
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [ -n "${PHOTO_TV_RELEASE_KEYSTORE_B64:-}" ] &&
             [ -n "${PHOTO_TV_RELEASE_STORE_PASSWORD:-}" ] &&
             [ -n "${PHOTO_TV_RELEASE_KEY_ALIAS:-}" ] &&
             [ -n "${PHOTO_TV_RELEASE_KEY_PASSWORD:-}" ]; then
            mkdir -p build-keys
            printf '%s' "$PHOTO_TV_RELEASE_KEYSTORE_B64" | base64 --decode > build-keys/photo-tv-release.keystore
            echo "PHOTO_TV_RELEASE_KEYSTORE_PATH=$PWD/build-keys/photo-tv-release.keystore" >> "$GITHUB_ENV"
            echo "PHOTO_TV_BUILD_VARIANT=release" >> "$GITHUB_ENV"
            echo "secure release signer configured"
          else
            echo "PHOTO_TV_BUILD_VARIANT=debug" >> "$GITHUB_ENV"
            echo "secure release signer not configured; using stable development signer"
          fi

      - name: Verify web preview
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("docs/index.html").read_text(encoding="utf-8")
          m = re.search(r"<script>([\s\S]*?)</script>", html)
          if not m:
              raise SystemExit("Inline script not found")
          js = m.group(1)
          required = [
              "function preview()", "function photos()", "function editor()",
              "function settings()", "function visibleAlbums()", "function mouse(e)",
              'cv.addEventListener("click",mouse)'
          ]
          missing = [item for item in required if item not in js]
          if missing:
              raise SystemExit("Missing web interactions: " + ", ".join(missing))
          Path("/tmp/photo-tv-preview.js").write_text(js, encoding="utf-8")
          PY
          node --check /tmp/photo-tv-preview.js
          node - <<'NODE'
          const fs = require("fs");
          const js = fs.readFileSync("/tmp/photo-tv-preview.js", "utf8");
          const prelude = `
          const gradientMock={addColorStop(){}};
          const mockCtx=new Proxy({
            createLinearGradient(){return gradientMock;},
            createRadialGradient(){return gradientMock;},
            measureText(t){return {width:String(t).length*7,actualBoundingBoxAscent:10,actualBoundingBoxDescent:3};},
            roundRect(){},beginPath(){},fill(){},stroke(){},fillRect(){},clearRect(){},drawImage(){},save(){},restore(){},
            arc(){},moveTo(){},lineTo(){},closePath(){},clip(){},translate(){},scale(){},rotate(){},strokeRect(){},setLineDash(){}
          },{get(t,p){if(p in t)return t[p];return ()=>{}},set(t,p,v){t[p]=v;return true}});
          const canvasMock={width:1280,height:720,getContext(){return mockCtx;},addEventListener(){},getBoundingClientRect(){return {left:0,top:0,width:1280,height:720}}};
          const inputMock={addEventListener(){},click(){},files:[]};
          globalThis.document={getElementById(id){return id==="tv"?canvasMock:inputMock},addEventListener(){}};
          globalThis.localStorage={getItem(){return null},setItem(){}};
          globalThis.Image=class{constructor(){this.complete=true;this.naturalWidth=1280;this.naturalHeight=720}set src(v){this._src=v}get src(){return this._src}};
          globalThis.Path2D=class{constructor(){}};
          globalThis.URL={createObjectURL(){return "blob:test"},revokeObjectURL(){}};
          globalThis.Blob=class{};
          globalThis.prompt=()=>null;
          globalThis.setInterval=()=>0;
          globalThis.setTimeout=()=>0;
          `;
          const checks = `
          page=1; photos();
          page=2; editor();
          page=3; settingsCat=0; settings();
          page=3; settingsCat=6; settings();
          page=0; preview();
          `;
          new Function(prelude + js + checks)();
          NODE

      - name: Setup visual regression tools
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pillow
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Visual regression against approved mockup
        shell: bash
        run: |
          set -euo pipefail
          rm -rf visual-results
          python3 -m http.server 4173 --directory docs >/tmp/photo-tv-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node visual/capture.mjs http://127.0.0.1:4173/ visual-results
          python3 visual/compare.py

      - name: Upload visual regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Photo-TV-Visual-Regression
          path: visual-results
          if-no-files-found: warn
          retention-days: 30

      - name: Run JVM tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          if [ "${PHOTO_TV_BUILD_VARIANT:-debug}" = "release" ]; then
            gradle --no-daemon --stacktrace assembleRelease
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ "${PHOTO_TV_BUILD_VARIANT:-debug}" = "release" ]; then
            APK="app/build/outputs/apk/release/app-release.apk"
            MODE="secure-release"
          else
            APK="app/build/outputs/apk/debug/app-debug.apk"
            MODE="stable-development"
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signature.txt
          ACTUAL="$(sed -n -E 's/^.*certificate SHA-256 digest: //p' signature.txt | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ': ')"
          test -n "$ACTUAL"

          if [ "$MODE" = "stable-development" ]; then
            EXPECTED="8480f37e2123c7c93ada4dbedef25e0f0f80ec689575c9e75ddc174c43c62d06"
            test "$ACTUAL" = "$EXPECTED" || {
              echo "Unexpected stable development signer: $ACTUAL" >&2
              exit 1
            }
          elif [ -n "${PHOTO_TV_RELEASE_CERT_SHA256:-}" ]; then
            EXPECTED="$(printf '%s' "$PHOTO_TV_RELEASE_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ': ')"
            test "$ACTUAL" = "$EXPECTED" || {
              echo "Unexpected secure release signer: $ACTUAL" >&2
              exit 1
            }
          fi

          printf 'mode=%s\ncertificate_sha256=%s\n' "$MODE" "$ACTUAL" > signing-mode.txt
          cp "$APK" Photo-TV.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Photo-TV-APK
          path: |
            Photo-TV.apk
            signing-mode.txt
          if-no-files-found: error
          retention-days: 30


  android-tv:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: Photo-TV-APK
          path: .

      - name: Setup Android visual tools
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --quiet pillow

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android TV emulator screenshots and remote regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest
            bash visual/run_android_tv_ci.sh Photo-TV.apk android-visual-results

      - name: Upload Android TV visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Photo-TV-Android-TV-Regression
          path: android-visual-results
          if-no-files-found: warn
          retention-days: 30


  resolution-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 720p
            resolution: 1280x720
          - label: 1080p
            resolution: 1920x1080
          - label: 4k
            resolution: 3840x2160
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: Photo-TV-APK
          path: .

      - name: Install screenshot verifier
        run: python3 -m pip install --disable-pip-version-check --quiet pillow

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Smoke test ${{ matrix.label }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash -lc '
            set -euo pipefail
            adb shell wm size ${{ matrix.resolution }}
            adb install -r Photo-TV.apk
            adb shell am force-stop fr.wokgui.phototv
            adb shell am start -n fr.wokgui.phototv/.MainActivity --ez phototv_test_mode true --ei phototv_test_page 0
            sleep 3
            adb shell dumpsys activity activities | grep -q "fr.wokgui.phototv"
            mkdir -p resolution-results/${{ matrix.label }}
            adb exec-out screencap -p > resolution-results/${{ matrix.label }}/preview.png
            python3 - <<'PY'
            from PIL import Image
            from pathlib import Path
            import os
            expected = "${{ matrix.resolution }}"
            w, h = map(int, expected.split("x"))
            p = Path("resolution-results/${{ matrix.label }}/preview.png")
            im = Image.open(p)
            actual = im.size
            if actual != (w, h):
                raise SystemExit(f"Unexpected screenshot size: {actual}, expected {(w, h)}")
            print(f"Verified {actual[0]}x{actual[1]}")
            PY
            adb logcat -d | grep -E "FATAL EXCEPTION|AndroidRuntime.*fr.wokgui.phototv" && exit 1 || true
            '

      - name: Upload ${{ matrix.label }} screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Photo-TV-Resolution-${{ matrix.label }}
          path: resolution-results/${{ matrix.label }}
          if-no-files-found: warn
          retention-days: 30


  marathon-tv:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: Photo-TV-APK
          path: .

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android TV marathon
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash -lc '
            set -euo pipefail
            mkdir -p marathon-results
            adb install -r Photo-TV.apk
            adb shell am force-stop fr.wokgui.phototv
            adb shell am start -n fr.wokgui.phototv/.MainActivity --ez phototv_test_mode true --ei phototv_test_page 0
            sleep 2
            : > marathon-results/memory.txt
            for i in $(seq 1 2500); do
              case $((i % 8)) in
                0) adb shell input keyevent 22 ;;
                1) adb shell input keyevent 21 ;;
                2) adb shell input keyevent 20 ;;
                3) adb shell input keyevent 19 ;;
                4) adb shell input keyevent 23 ;;
                5) adb shell input keyevent 4 ;;
                6) adb shell input keyevent 22 ;;
                7) adb shell input keyevent 23 ;;
              esac
              if (( i % 500 == 0 )); then
                echo "=== step $i ===" >> marathon-results/memory.txt
                adb shell dumpsys meminfo fr.wokgui.phototv | grep -E "TOTAL PSS|TOTAL RSS|Java Heap|Native Heap" >> marathon-results/memory.txt || true
              fi
            done
            adb shell dumpsys activity activities | grep -q "fr.wokgui.phototv"
            adb logcat -d > marathon-results/logcat.txt
            if grep -E "FATAL EXCEPTION|OutOfMemoryError" marathon-results/logcat.txt | grep -q "fr.wokgui.phototv"; then
              echo "Crash or OOM detected" >&2
              exit 1
            fi
            '

      - name: Upload marathon diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Photo-TV-Marathon
          path: marathon-results
          if-no-files-found: warn
          retention-days: 30
