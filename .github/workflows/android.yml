name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Photo-TV.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Photo-TV-APK
          path: Photo-TV.apk
          if-no-files-found: error
          retention-days: 30
