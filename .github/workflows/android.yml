name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify web preview
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("docs/index.html").read_text(encoding="utf-8")
          m = re.search(r"<script>([\s\S]*?)</script>", html)
          if not m:
              raise SystemExit("Inline script not found")
          js = m.group(1)
          required = [
              "function preview()", "function photos()", "function editor()",
              "function settings()", "function mouse(e)",
              'cv.addEventListener("click",mouse)'
          ]
          missing = [item for item in required if item not in js]
          if missing:
              raise SystemExit("Missing web interactions: " + ", ".join(missing))
          Path("/tmp/photo-tv-preview.js").write_text(js, encoding="utf-8")
          PY
          node --check /tmp/photo-tv-preview.js

      - name: Run JVM tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Photo-TV.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Photo-TV-APK
          path: Photo-TV.apk
          if-no-files-found: error
          retention-days: 30
