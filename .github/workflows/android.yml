name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify web preview
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("docs/index.html").read_text(encoding="utf-8")
          m = re.search(r"<script>([\s\S]*?)</script>", html)
          if not m:
              raise SystemExit("Inline script not found")
          js = m.group(1)
          required = [
              "function preview()", "function photos()", "function editor()",
              "function settings()", "function visibleAlbums()", "function mouse(e)",
              'cv.addEventListener("click",mouse)'
          ]
          missing = [item for item in required if item not in js]
          if missing:
              raise SystemExit("Missing web interactions: " + ", ".join(missing))
          Path("/tmp/photo-tv-preview.js").write_text(js, encoding="utf-8")
          PY
          node --check /tmp/photo-tv-preview.js
          node - <<'NODE'
          const fs = require("fs");
          const js = fs.readFileSync("/tmp/photo-tv-preview.js", "utf8");
          const prelude = `
          const gradientMock={addColorStop(){}};
          const mockCtx=new Proxy({
            createLinearGradient(){return gradientMock;},
            createRadialGradient(){return gradientMock;},
            measureText(t){return {width:String(t).length*7,actualBoundingBoxAscent:10,actualBoundingBoxDescent:3};},
            roundRect(){},beginPath(){},fill(){},stroke(){},fillRect(){},clearRect(){},drawImage(){},save(){},restore(){},
            arc(){},moveTo(){},lineTo(){},closePath(){},clip(){},translate(){},scale(){},rotate(){},strokeRect(){},setLineDash(){}
          },{get(t,p){if(p in t)return t[p];return ()=>{}},set(t,p,v){t[p]=v;return true}});
          const canvasMock={width:1280,height:720,getContext(){return mockCtx;},addEventListener(){},getBoundingClientRect(){return {left:0,top:0,width:1280,height:720}}};
          const inputMock={addEventListener(){},click(){},files:[]};
          globalThis.document={getElementById(id){return id==="tv"?canvasMock:inputMock},addEventListener(){}};
          globalThis.localStorage={getItem(){return null},setItem(){}};
          globalThis.Image=class{constructor(){this.complete=true;this.naturalWidth=1280;this.naturalHeight=720}set src(v){this._src=v}get src(){return this._src}};
          globalThis.Path2D=class{constructor(){}};
          globalThis.URL={createObjectURL(){return "blob:test"},revokeObjectURL(){}};
          globalThis.Blob=class{};
          globalThis.prompt=()=>null;
          globalThis.setInterval=()=>0;
          globalThis.setTimeout=()=>0;
          `;
          const checks = `
          page=1; photos();
          page=2; editor();
          page=3; settingsCat=0; settings();
          page=3; settingsCat=6; settings();
          page=0; preview();
          `;
          new Function(prelude + js + checks)();
          NODE

      - name: Setup visual regression tools
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pillow
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Visual regression against approved mockup
        shell: bash
        run: |
          set -euo pipefail
          rm -rf visual-results
          python3 -m http.server 4173 --directory docs >/tmp/photo-tv-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node visual/capture.mjs http://127.0.0.1:4173/ visual-results
          python3 visual/compare.py

      - name: Upload visual regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Photo-TV-Visual-Regression
          path: visual-results
          if-no-files-found: warn
          retention-days: 30

      - name: Run JVM tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Photo-TV.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Photo-TV-APK
          path: Photo-TV.apk
          if-no-files-found: error
          retention-days: 30
